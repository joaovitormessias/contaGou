server {
    listen 80;
    client_max_body_size 10m;

    location / {
        proxy_pass http://frontend:80;
    }
    location /api/ {
        proxy_pass http://backend:3001/;
        proxy_read_timeout 120s;
    }
    location = /ingest-document {
        proxy_pass http://n8n:5678/webhook/ingest-document;
        proxy_read_timeout 120s;
    }
}
