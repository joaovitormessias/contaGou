# Demonstracao temporaria com frontend compilado e gateway de mesma origem.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Configure .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure .env}
      POSTGRES_DB: ${POSTGRES_DB:?Configure .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:?Configure .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Configure .env}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.55}
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.demo
    restart: unless-stopped
    depends_on:
      - backend
  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:2.43.1}
    restart: unless-stopped
    ports:
      - '127.0.0.1:5679:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # Editor disponivel apenas por loopback/SSH para configuracao local.
      N8N_SECURE_COOKIE: 'false'
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8088:80'
    volumes:
      - ./infra/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - n8n
volumes:
  postgres_data:
  n8n_data:
